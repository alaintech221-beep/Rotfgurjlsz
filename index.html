<script>
// Code partagé (favoris + installation)
function lireFavs(cle){ try { return JSON.parse(localStorage.getItem("favoris-" + cle)) || []; } catch (e) { return []; } }
function ecrireFavs(cle, a){ try { localStorage.setItem("favoris-" + cle, JSON.stringify(a)); } catch (e) {} }

// Ajoute un bouton cœur sur une carte. "apres" est appelé après chaque changement.
function envelopper(carte, cle, nom, apres){
  const w = document.createElement("div");
  w.className = "enveloppe";
  const h = document.createElement("button");
  h.className = "coeur";
  h.setAttribute("aria-label", "Ajouter ou retirer des favoris");
  const maj = () => { const on = lireFavs(cle).includes(nom); h.textContent = on ? "\u2665" : "\u2661"; h.classList.toggle("on", on); };
  h.onclick = () => {
    const a = lireFavs(cle), i = a.indexOf(nom);
    if (i >= 0) a.splice(i, 1); else a.push(nom);
    ecrireFavs(cle, a); maj(); if (a.includes(nom)){ h.classList.remove("pop"); void h.offsetWidth; h.classList.add("pop"); }
    if (apres) apres();
    if (window.toast) toast(a.includes(nom) ? "Ajouté aux favoris" : "Retiré des favoris");
  };
  maj();
  w.append(carte, h);
  return w;
}

// Style des ajouts

+ ".icone:hover{border-color:#e8507f}.icone:active{transform:scale(.92)}"

// Bouton loupe : ouvre et ferme la barre de recherche
const btnR = document.getElementById("btnRecherche"), barreR = document.getElementById("barreRecherche"), champ = document.getElementById("recherche");
if (btnR && barreR && champ){

    if (o) champ.focus();

  btnR.onclick = () => ouvrir(barreR.hidden);

}

// Contenu géré depuis la page admin (lu dans la base ; garde une copie pour l'ouverture rapide)
const BASE_DONNEES = "https://youtv-4874c-default-rtdb.firebaseio.com";
// App Check : la base ne répond qu'aux appels vérifiés venant de ce site (clé de site publique, reCAPTCHA Enterprise)
const CONFIG_FIREBASE = {

let _lectureBase = null;
function lireBase(cle){
  if (!_lectureBase) _lectureBase = (async () => {
    const base = "https://www.gstatic.com/firebasejs/10.12.2/";
    const { initializeApp } = await import(base + "firebase-app.js");
    const { initializeAppCheck, ReCaptchaEnterpriseProvider } = await import(base + "firebase-app-check.js");
    const { getDatabase, ref, get } = await import(base + "firebase-database.js");
    const app = initializeApp(CONFIG_FIREBASE);
    initializeAppCheck(app, { provider: new ReCaptchaEnterpriseProvider(CLE_RECAPTCHA), isTokenAutoRefreshEnabled: true });
    const db = getDatabase(app);
    return async c => { const sn = await get(ref(db, "contenus/" + c)); return sn.exists() ? sn.val() : null; };
  })();
  return _lectureBase.then(lire => lire(cle));
}
// Plan B si le kit Firebase ne peut pas se charger (extension qui bloque Google, réseau filtré...)
function lireDirect(cle){
  return fetch(BASE_DONNEES + "/contenus/" + cle + ".json", { cache: "no-store" }).then(r => r.ok ? r.json() : null);
}
function chargerContenu(cle, tableau, afficher){
  const appliquer = l => { tableau.splice(0, tableau.length, ...l); afficher(); };
  try { const c = JSON.parse(localStorage.getItem("contenu-" + cle)); if (Array.isArray(c)) appliquer(c); } catch (e) {}
  lireBase(cle).catch(() => lireDirect(cle))
    .then(d => {
      if (!d || typeof d !== "object") return;
      const l = d.liste ? (Array.isArray(d.liste) ? d.liste : Object.values(d.liste)) : [];
      const propre = l.filter(x => x && !x.masque);
      try { localStorage.setItem("contenu-" + cle, JSON.stringify(propre)); } catch (e) {}
      appliquer(propre);
    }).catch(() => {});
}

function montrerAnnonce(a){
  const zone = document.getElementById("annonce");
  const texte = a && typeof a.texte === "string" ? a.texte.trim() : "";
  const aujourdhui = new Date(); const jour = aujourdhui.getFullYear() + "-" + String(aujourdhui.getMonth() + 1).padStart(2, "0") + "-" + String(aujourdhui.getDate()).padStart(2, "0");
  const expire = a && typeof a.fin === "string" && a.fin && jour > a.fin;
  let fermee = null;
  try { fermee = localStorage.getItem("annonce-fermee"); } catch (e) {}
  const cle = texte + "|" + (a && a.maj || "");
  if (!a || a.actif !== "oui" || !texte || expire || fermee === cle){ zone.hidden = true; return; }
  document.getElementById("annonceTexte").textContent = texte;
  const lien = document.getElementById("annonceLien");
  if (typeof a.lien === "string" && /^https:\/\//i.test(a.lien.trim())){ lien.href = a.lien.trim(); lien.hidden = false; } else { lien.hidden = true; }
  document.getElementById("annonceFermer").onclick = () => { zone.hidden = true; try { localStorage.setItem("annonce-fermee", cle); } catch (e) {} };
  zone.hidden = false;
}
function chargerAnnonce(){
  try { montrerAnnonce(JSON.parse(localStorage.getItem("contenu-annonce"))); } catch (e) {}
  lireBase("annonce").catch(() => lireDirect("annonce")).then(d => {
    try { localStorage.setItem("contenu-annonce", JSON.stringify(d && typeof d === "object" ? d : null)); } catch (e) {}
    montrerAnnonce(d);
  }).catch(() => {});
}

// Signaler un lien qui ne marche pas : ouvre WhatsApp. Si NUMERO_WHATSAPP est rempli, le message est déjà écrit ;
// sinon le message est copié et WhatsApp s'ouvre : il suffit de le coller.
const NUMERO_WHATSAPP = "";   // exemple : "221770000000" (indicatif du pays + numéro, sans + ni espaces)
function retourBouton(b){
  return t => { const avant = b.dataset.t || (b.dataset.t = b.innerHTML); b.textContent = t; setTimeout(() => { b.innerHTML = avant; }, 3000); };
}
function signaler(type, nom, retour){
  if (!nom) return;
  const msg = "Signalement DAFLIX TV : le lien " + type + " « " + nom + " » ne fonctionne pas. Page : " + location.href;
  const num = NUMERO_WHATSAPP.replace(/\D/g, "");
  if (num){ window.open("https://wa.me/" + num + "?text=" + encodeURIComponent(msg), "_blank", "noopener"); retour("Merci ✓"); return; }
  window.open(typeof LIEN_WHATSAPP === "string" ? LIEN_WHATSAPP : "https://wa.link/fpp3vr", "_blank", "noopener");
  const invite = () => prompt("Copie ce message et colle-le dans WhatsApp :", msg);
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(msg).then(() => retour("Message copié ✓"), invite);
  else invite();
}

// Installation sur l'écran d'accueil + mode hors ligne
let invite = null;
window.addEventListener("beforeinstallprompt", e => {
  e.preventDefault(); invite = e;
  const b = document.createElement("button");
  b.id = "btnInstaller"; b.className = "btn"; b.textContent = "Installer l'application";
  b.onclick = () => { invite.prompt(); b.remove(); };
  document.body.appendChild(b);
});
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
<script src="player.js"></script>
<script>
// Ajoute tes chaînes ici. "logo" = lien d'une image png ou jpg. Laisse "url" vide tant que tu n'as pas de flux.
const chaines = [
  // Exemple (retire les // pour l'utiliser) :
  // { nom: "Ma Chaîne", logo: "", categorie: "Sport", url: "https://..." },
];

const video = document.getElementById("video");
const grille = document.getElementById("grille");
const filtres = document.getElementById("filtres");
const enCours = document.getElementById("enCours");
const nomChaine = document.getElementById("nomChaine");
let categorieActive = "Toutes";
let chaineActive = null;
let animer = true, chargementFini = false, ordreZap = [];

const zoneLecteur = document.getElementById("lecteur");
const lecteur = new LecteurTV(zoneLecteur, video);
lecteur.accueil("Choisis une chaîne", "Touche une chaîne dans la liste pour la lancer.");


function afficherFiltres(){
  const cats = ["Toutes", "Favoris", ...new Set(chaines.map(c => c.categorie))];
  filtres.innerHTML = "";
  cats.forEach(cat => {
    const b = document.createElement("button");
    b.className = "chip" + (cat === categorieActive ? " actif" : "");
    b.textContent = cat;
    b.onclick = () => { categorieActive = cat; animer = true; afficherFiltres(); afficherChaines(); };
    filtres.appendChild(b);
  });
}

function creerLogo(c){
  const vide = () => { const d = document.createElement("div"); d.className = "logo-vide"; d.textContent = c.nom.charAt(0); const t = [...c.nom].reduce((a, ch) => (a * 31 + ch.charCodeAt(0)) % 360, 7); d.style.background = "linear-gradient(135deg,hsl(" + t + ",55%,32%),hsl(" + ((t + 40) % 360) + ",60%,18%))"; return d; };
  if (!c.logo) return vide();
  const img = document.createElement("img");
  img.className = "logo-chaine"; img.src = c.logo; img.alt = c.nom; img.loading = "lazy";
  img.onerror = () => img.replaceWith(vide());
  return img;
}

const sansAccent = t => String(t == null ? "" : t).normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
const estNouveau = c => c.nouveau === "oui" || (c.nouveau !== "non" && typeof c.ajoute === "number" && Date.now() - c.ajoute < 7 * 864e5);
function afficherChaines(){
  grille.innerHTML = "";
  grille.classList.toggle("anime", animer); animer = false;
  const terme = sansAccent(document.getElementById("recherche").value.trim());
  const favs = lireFavs("chaines");
  const liste = chaines.filter(c => (categorieActive === "Toutes" || (categorieActive === "Favoris" ? favs.includes(c.nom) : c.categorie === categorieActive)) && sansAccent(c.nom).includes(terme));
  if (!liste.length){
    ordreZap = []; majZap();
    if (!chaines.length && !chargementFini){
      for (let k = 0; k < 9; k++){ const q = document.createElement("div"); q.className = "squelette"; grille.appendChild(q); }
    } else {
      grille.innerHTML = '<p class="vide">' + (chaines.length ? (categorieActive === "Favoris" ? "Touche le cœur d'une chaîne pour l'ajouter à tes favoris." : "Aucune chaîne trouvée.") : "Les chaînes arrivent bientôt.") + '</p>';
    }
    return;
  }
  let i = 0;
  const ajouter = c => {
    const b = document.createElement("button");
    b.className = "chaine" + (chaineActive && c.nom === chaineActive.nom ? " actif" : "");
    b.innerHTML = "<b></b><span></span>";
    b.prepend(creerLogo(c));
    b.querySelector("b").textContent = c.nom;
    b.querySelector("span").textContent = c.categorie;
    b.onclick = () => lancer(c);
    const w = envelopper(b, "chaines", c.nom, () => { if (categorieActive === "Favoris" || categorieActive === "Toutes") afficherChaines(); });
    w.style.setProperty("--i", Math.min(i++, 12));
    if (estNouveau(c)){ const bn = document.createElement("span"); bn.className = "badge-nouveau"; bn.textContent = "NOUVEAU"; w.appendChild(bn); }
    grille.appendChild(w);
  };
  const titre = t => { const h = document.createElement("h2"); h.className = "titre-sect"; h.textContent = t; grille.appendChild(h); };
  if (categorieActive === "Toutes" && !terme && liste.some(c => favs.includes(c.nom))){
    const f = liste.filter(c => favs.includes(c.nom)), r = liste.filter(c => !favs.includes(c.nom));
    titre("♥ Mes favoris"); f.forEach(ajouter);
    if (r.length){ titre("Toutes les chaînes"); r.forEach(ajouter); }
    ordreZap = [...f, ...r];
  } else {
    liste.forEach(ajouter);
    ordreZap = liste;
  }
  majZap();
}

// Zapping : chaîne précédente / suivante dans l'ordre affiché (les chaînes sans flux sont sautées)
function majZap(){
  const off = ordreZap.filter(c => c.url).length < 2;
  const p = document.getElementById("btnPrec"), n = document.getElementById("btnSuiv");
  if (p) p.disabled = off;
  if (n) n.disabled = off;
}
function zapper(d){
  const L = ordreZap.length;
  if (L < 2) return;
  let i = chaineActive ? ordreZap.findIndex(c => c.nom === chaineActive.nom) : -1;
  for (let k = 0; k < L; k++){
    i = i < 0 ? (d > 0 ? 0 : L - 1) : (i + d + L) % L;
    if (ordreZap[i].url){ lancer(ordreZap[i]); return; }
  }
}
document.getElementById("btnPrec").onclick = () => zapper(-1);
document.getElementById("btnSuiv").onclick = () => zapper(1);
document.addEventListener("keydown", e => {
  if (e.ctrlKey || e.metaKey || e.altKey || e.shiftKey) return;
  if (e.key !== "ArrowLeft" && e.key !== "ArrowRight") return;
  const t = e.target;
  if (zoneLecteur.contains(t) || (t && /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName)) || document.querySelector("dialog[open]")) return;
  if (!chaineActive) return;
  e.preventDefault(); zapper(e.key === "ArrowRight" ? 1 : -1);
});

// Une chaîne dont l'url est "auto:mbozo" récupère son lien m3u8 automatiquement (voir netlify/functions/flux.js)
async function lireChaine(c){
  let url = c.url;
  if (/^auto:/i.test(url)){
    try {
      const r = await fetch("/.netlify/functions/flux?id=" + encodeURIComponent(url.slice(5).trim()), { cache: "no-store" });
      const d = await r.json();
      if (!d.url) throw new Error(d.erreur || "pas de lien");
      url = d.url;
    } catch (e) {
      lecteur.accueil(c.nom, "Le flux est indisponible pour le moment. Réessaie dans un instant.");
      return;
    }
  }
  lecteur.lire(url, { titre: c.nom, logo: c.logo });
}
// Si le lien automatique expire en cours de lecture, on en redemande un nouveau
video.addEventListener("error", () => { if (chaineActive && /^auto:/i.test(chaineActive.url || "")) setTimeout(() => lireChaine(chaineActive), 2500); });

function lancer(c){
  chaineActive = c;
  try { localStorage.setItem("derniere-chaine", c.nom); } catch (e) {}
  document.getElementById("reprise").hidden = true;
  enCours.hidden = false;
  nomChaine.textContent = c.nom;
  if (!c.url){
    lecteur.accueil(c.nom, "Aucun flux n'est encore ajouté pour cette chaîne.");
  } else {
    lireChaine(c);
  }
  // Sur téléphone, la liste est plus bas : on ramène le lecteur à l'écran
  const r = zoneLecteur.getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) zoneLecteur.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion:reduce)").matches ? "auto" : "smooth", block: "start" });
  afficherChaines();
}

// Reprendre la dernière chaîne regardée (le lancement automatique est bloqué par les navigateurs : un clic est nécessaire)
function afficherReprise(){
  const zone = document.getElementById("reprise");
  let nom = null;
  try { nom = localStorage.getItem("derniere-chaine"); } catch (e) {}
  const c = nom && chaines.find(x => x.nom === nom);
  if (!c || chaineActive){ zone.hidden = true; return; }
  const b = document.getElementById("btnReprendre");
  b.textContent = "▶ Reprendre : " + c.nom;
  b.onclick = () => lancer(c);
  zone.hidden = false;
}

// Lien direct : ?chaine=Nom ouvre cette chaîne
let lienTraite = false;
function ouvrirLienDirect(){
  if (lienTraite) return;
  let nom = null;
  try { nom = new URLSearchParams(location.search).get("chaine"); } catch (e) {}
  if (!nom){ lienTraite = true; return; }
  const c = chaines.find(x => x.nom.toLowerCase() === nom.toLowerCase());
  if (c){ lienTraite = true; lancer(c); }
}

// Partager la chaîne en cours (menu de partage du téléphone, sinon copie du lien)
const btnPartager = document.getElementById("btnPartager");
btnPartager.onclick = async () => {
  if (!chaineActive) return;
  const retour = retourBouton(btnPartager);
  const lien = location.origin + location.pathname.replace(/index\.html$/, "") + "?chaine=" + encodeURIComponent(chaineActive.nom);
  const data = { title: "DAFLIX TV", text: "Regarde " + chaineActive.nom + " en direct sur DAFLIX TV", url: lien };
  if (navigator.share){
    try { await navigator.share(data); return; } catch (e) { if (e && e.name === "AbortError") return; }
  }
  try { await navigator.clipboard.writeText(lien); retour("Lien copié ✓"); }
  catch (e) { window.prompt("Copie ce lien :", lien); }
};

const btnSignaler = document.getElementById("btnSignaler");
btnSignaler.onclick = () => signaler("de la chaîne", document.getElementById("nomChaine").textContent, retourBouton(btnSignaler));
document.getElementById("recherche").oninput = afficherChaines;
afficherFiltres();
afficherChaines();
chargerAnnonce();
setTimeout(() => { chargementFini = true; if (!chaines.length) afficherChaines(); }, 8000);
chargerContenu("chaines", chaines, () => { chargementFini = true; animer = true; categorieActive = "Toutes"; afficherFiltres(); afficherChaines(); ouvrirLienDirect(); afficherReprise(); });

const dlg = document.getElementById("dlgContact");

document.getElementById("fermerContact").onclick = () => dlg.close();
dlg.addEventListener("click", e => { if (e.target === dlg) dlg.close(); });
</script>
