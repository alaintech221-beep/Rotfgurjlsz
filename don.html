<script>
// Valeurs de départ (utilisées si la base est vide ou injoignable).
// Le titre, les textes et les moyens de paiement se changent aussi depuis la page admin, onglet « Don ».
const don = {
  titre: "Soutenir DAFLIX TV",
  texte: "DAFLIX TV est gratuite. Si le site te plaît, tu peux m'aider à le garder en ligne avec un petit don.",
  merci: "Merci pour ton soutien ❤",
  moyens: [
    { nom: "Wave", numero: "", lien: "https://pay.wave.com/m/M_sn_1aEZGz9BnNJH/c/sn/" }
  ]
};
const BASE_DONNEES = "https://youtv-4874c-default-rtdb.firebaseio.com";

function copier(texte){
  const fin = () => {
    const c = document.getElementById("copie");
    c.hidden = false; setTimeout(() => { c.hidden = true; }, 1800);
  };
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(texte).then(fin, () => prompt("Copie ce numéro :", texte));
  } else { prompt("Copie ce numéro :", texte); }
}

function afficherDon(){
  document.getElementById("titre").textContent = don.titre;
  document.getElementById("texte").textContent = don.texte;
  document.getElementById("merci").textContent = don.merci;
  const liste = document.getElementById("liste");
  liste.innerHTML = "";
  if (!don.moyens.length){
    const p = document.createElement("p"); p.className = "bientot"; p.style.textAlign = "center";
    p.textContent = "Les dons seront bientôt disponibles."; liste.appendChild(p); return;
  }
  don.moyens.forEach(m => {
    const bloc = document.createElement("section");
    bloc.className = "moyen";
    const h = document.createElement("h2"); h.textContent = m.nom; bloc.appendChild(h);
    if (!m.numero && !m.lien){
      const p = document.createElement("p"); p.className = "bientot"; p.textContent = "Bientôt disponible."; bloc.appendChild(p);
    }
    if (m.numero){
      const n = document.createElement("div"); n.className = "numero";
      const t = document.createElement("strong"); t.textContent = m.numero;
      const b = document.createElement("button"); b.className = "btn gris"; b.type = "button"; b.textContent = "Copier";
      b.onclick = () => copier(m.numero);
      n.append(t, b); bloc.appendChild(n);
    }
    if (m.lien){
      const a = document.createElement("a"); a.className = "btn payer"; a.href = m.lien; a.target = "_blank"; a.rel = "noopener";
      a.textContent = "Donner avec " + m.nom; bloc.appendChild(a);
    }
    liste.appendChild(bloc);
  });
}

function appliquerDon(c){
  if (!c || typeof c !== "object") return;
  if (c.textes && typeof c.textes === "object") ["titre", "texte", "merci"].forEach(k => { if (typeof c.textes[k] === "string" && c.textes[k]) don[k] = c.textes[k]; });
  if (Array.isArray(c.moyens)) don.moyens = c.moyens.filter(m => m && m.nom).map(m => ({ nom: String(m.nom), numero: String(m.numero || ""), lien: /^https:\/\//i.test(m.lien || "") ? m.lien : "" }));
  afficherDon();
}

afficherDon();
try { appliquerDon(JSON.parse(localStorage.getItem("contenu-don"))); } catch (e) {}
Promise.all(["don", "moyens"].map(k => fetch(BASE_DONNEES + "/contenus/" + k + ".json", { cache: "no-store" }).then(r => r.ok ? r.json() : null).catch(() => null)))
  .then(([t, m]) => {
    const c = {};
    if (t && typeof t === "object") c.textes = t;
    if (m && typeof m === "object") c.moyens = m.liste ? (Array.isArray(m.liste) ? m.liste : Object.values(m.liste)) : [];
    if (!c.textes && !c.moyens) return;
    try { localStorage.setItem("contenu-don", JSON.stringify(c)); } catch (e) {}
    appliquerDon(c);
  });

const dlg = document.getElementById("dlgContact");

document.getElementById("fermerContact").onclick = () => dlg.close();
dlg.addEventListener("click", e => { if (e.target === dlg) dlg.close(); });
</script>
